# ============================================================
# note 自動投稿システム 設定ファイル
# ============================================================

# --- 発信者・コンテンツの基本方針 ---
author:
  name: "Yasuto Hoshiko"
  role: "GKアナリスト / ゴールキーパー分析コーチ"
  # 記事全体のトーン・専門性。AIはこれを踏まえて本文を書く。
  persona: >
    ヨーロッパの現代的GK育成メソッドに精通したゴールキーパー分析の専門家。
    大学トップチームのGKコーチ、Jリーグ育成経験、複数のプロ選手を育成した実績を持つ。
    指導者・選手・クラブに向けて、客観的で実践的な分析を分かりやすく届ける。

# --- 記事の生成ルール ---
article:
  language: "ja"          # 記事の言語
  min_chars: 1500          # 目標の最小文字数（本文）
  max_chars: 3500          # 目標の最大文字数（本文）
  # 記事末尾に必ず入れる導線（サービス紹介・問い合わせ）
  call_to_action: >
    GK分析・育成プランのご相談は、プロフィールのリンクまたは
    yasutohoshiko1986@gmail.com までお気軽にどうぞ。
  # 各記事に付けるタグ（noteのハッシュタグ）
  default_tags:
    - "ゴールキーパー"
    - "サッカー"
    - "GK育成"
    - "分析"

# --- 販売（有料note）の設定 ---
sale:
  # true にすると、生成した記事を有料noteとして設定する
  enabled: false
  # 価格（円）。note の有料note最低価格は100円〜
  price: 500
  # 有料ラインより上（無料で読める部分）の文字数の目安。
  # AIはこの位置に区切りを想定して「無料パート」と「有料パート」を書き分ける。
  free_intro_chars: 600

# --- 投稿の挙動 ---
publish:
  # draft: 下書き保存のみ（推奨・安全）
  # publish: 公開まで自動で行う
  mode: "draft"
  # 1回の run で処理する記事数の上限（連続投稿によるアカウント制限を避ける）
  max_per_run: 1
