name: J4K launch queue (daily)

on:
  schedule:
    # 毎日 UTC 09:00 = 日本時間(JST) 18:00（夕方）。GitHub側の遅延で前後することがあります。
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate caption only (do not post)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: launch-queue
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ffmpeg (webp -> jpg)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        working-directory: instagram-bot
        run: npm install

      - name: Post next queued launch image
        working-directory: instagram-bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: npm run post:launch-queue
