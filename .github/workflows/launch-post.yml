name: J4K launch post (manual)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate only (do not post)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: launch-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: instagram-bot
        run: npm install

      - name: Publish the launch post
        working-directory: instagram-bot
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node post-launch.js
