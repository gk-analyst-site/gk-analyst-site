name: Amazon店舗レポートを作る

# このワークフロー(自動作業員)がやること:
#   amazon-shop/data/ に成績表CSVが置かれたら、分析して
#   report.html(診断) と todo.md(今週やること) を作り直します。
#   ※売上データを守るため「非公開リポジトリ」のときだけ動きます。

on:
  schedule:
    # 毎週月曜 UTC 21:00 = 日本時間 火曜 朝6:00
    - cron: "0 21 * * 1"
  workflow_dispatch: {}
  push:
    paths:
      - "amazon-shop/data/**"
      - "amazon-shop/analyze.py"

permissions:
  contents: write

jobs:
  build:
    # 公開リポジトリでは売上が見えてしまうので動かさない
    if: github.event.repository.private == true
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python を用意
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 成績表を分析する
        run: python3 amazon-shop/analyze.py

      - name: できたレポートを保存(コミット)する
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f amazon-shop/output/report.html amazon-shop/output/todo.md amazon-shop/output/summary.json
          if git diff --staged --quiet; then
            echo "変更なし。コミットしません。"
          else
            git commit -m "chore: Amazon店舗レポートを更新"
            git push
          fi
